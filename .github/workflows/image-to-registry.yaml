name: image-to-registry
run-name: Build the image and push it to the registry (${{ github.ref_name }})

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  image-to-registry:
    environment: release

    strategy:
      fail-fast: false
      matrix:
        target-arch:
          - amd64
          - arm64
        include:
          - target-arch: amd64
            runner-os: ubuntu-latest
          - target-arch: arm64
            runner-os: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner-os }}
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      registry:
        image: registry:2
        ports:
          - "5000:5000"
        env:
          REGISTRY_STORAGE: s3
          REGISTRY_STORAGE_S3_REGION: ${{ secrets.DOCKER_IMAGE_REGISTRY_BUCKET_REGION }}
          REGISTRY_STORAGE_S3_BUCKET: ${{ secrets.DOCKER_IMAGE_REGISTRY_BUCKET_NAME }}
          REGISTRY_STORAGE_S3_ACCESSKEY: ${{ secrets.DOCKER_IMAGE_REGISTRY_BUCKET_ACCESS_KEY_ID }}
          REGISTRY_STORAGE_S3_SECRETKEY: ${{ secrets.DOCKER_IMAGE_REGISTRY_BUCKET_ACCESS_KEY_SECRET }}
          REGISTRY_STORAGE_S3_REGIONENDPOINT: https://s3.${{ secrets.DOCKER_IMAGE_REGISTRY_BUCKET_REGION }}.io.cloud.ovh.net/
          REGISTRY_STORAGE_S3_FORCEPATHSTYLE: true

    steps:
      - name: Set up cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-make
        run: cargo binstall --no-confirm cargo-make

      ## The builder pushes to the registry service on the runner's localhost
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Clone the repository
        uses: actions/checkout@v4

      - name: Build and push the image
        env:
          LOCAL_DOCKER_REGISTRY_AS_PROXY: localhost:5000
          DOCKER_IMAGE_PLATFORM: ${{ matrix.target-arch }}
        run: cargo make registry-image
